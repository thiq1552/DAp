[project]
name = "ccbus"
version = "0.1.0"
description = "Bảng tin dùng chung qua MCP cho nhiều máy cùng chạy Claude Code trên một project"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27",
]

[project.scripts]
ccbus-server = "ccbus.server:main"
ccbus = "ccbus.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccbus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
